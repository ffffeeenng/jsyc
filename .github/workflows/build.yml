name: 打包 Windows EXE

on:
  push:
  workflow_dispatch: # 支持手动一键触发

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 设置 Python 环境
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安装依赖包
        run: |
          python -m pip install --upgrade pip
          pip install pandas openpyxl pyinstaller

      - name: 使用 PyInstaller 打包
        run: |
          pyinstaller --noconsole --onefile --name "成绩分段计算器" test.py

      - name: 上传打包好的 EXE 文件
        uses: actions/upload-artifact@v4
        with:
          name: 成绩分段计算器-Windows
          path: dist/成绩分段计算器.exe
